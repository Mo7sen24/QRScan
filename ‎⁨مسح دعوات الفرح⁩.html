<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسح دعوات الفرح</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<style>
:root{--bg:#f4eeee;--ink:#14213d;--panel:#fff;--line:#d9cfcf;--ok:#1d7a45;--bad:#b3261e;--warn:#a86a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101523;--ink:#ece6df;--panel:#1a2136;--line:#33405f}}
:root[data-theme="dark"]{--bg:#101523;--ink:#ece6df;--panel:#1a2136;--line:#33405f}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Reem Kufi",Tahoma,sans-serif;font-size:17px;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px;display:grid;gap:14px}
h1{font-size:26px;margin:6px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
label{display:block;font-size:15px;margin-bottom:4px}
textarea,input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit}
textarea{min-height:110px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:13px}
button{font:inherit;font-size:16px;padding:10px 18px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button.alt{background:transparent;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b88a2c;outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row input{flex:1;min-width:150px;direction:ltr;text-align:left}
#cam{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3;display:none}
#cam video{width:100%;height:100%;object-fit:cover}
#result{border-radius:10px;padding:18px;text-align:center;border:2px solid var(--line);min-height:110px}
#result b{display:block;font-size:30px;line-height:1.3}
#result.ok{border-color:var(--ok);color:var(--ok)}
#result.bad{border-color:var(--bad);color:var(--bad)}
#result.warn{border-color:var(--warn);color:var(--warn)}
.stats{display:flex;justify-content:space-between;font-size:16px}
.small{font-size:14px;opacity:.75;margin:6px 0 0}
</style>
</head>
<body>
<main>
<h1>مسح دعوات الفرح</h1>

<section class="panel">
 <label for="list">قائمة المدعوين (الكود ثم الاسم، سطر لكل مدعو)</label>
 <textarea id="list" placeholder="WAB12-001-XYZ12&#9;محمد علي"></textarea>
 <div class="row"><button id="load">حفظ القائمة</button></div>
 <p class="small">الصق هنا القائمة اللي نسختها من صفحة الكروت.</p>
</section>

<section class="panel">
 <div id="cam"><video id="v" playsinline muted></video></div>
 <div class="row">
  <button id="start">تشغيل الكاميرا</button>
  <button id="stop" class="alt">إيقاف</button>
  <button id="snap" class="alt">تصوير الكود</button>
  <input id="file" type="file" accept="image/*" capture="environment" hidden>
 </div>
 <div class="row">
  <input id="manual" placeholder="أو اكتب الكود يدوي" aria-label="الكود">
  <button id="check" class="alt">تحقق</button>
 </div>
</section>

<section id="result" class="panel" aria-live="assertive"><b>جاهز للمسح</b></section>

<section class="panel">
 <div class="stats"><span>تم دخولهم: <b id="in">0</b></span><span>إجمالي المدعوين: <b id="total">0</b></span></div>
 <div class="row"><button id="reset" class="alt">تصفير الدخول</button></div>
 <p class="small">الحفظ على الجهاز ده فقط. استخدم جهاز واحد للباب، أو قسّم المدعوين على الأبواب.</p>
</section>
</main>
<script>
(function(){
 var $=function(i){return document.getElementById(i)};
 var guests={},used={},stream=null,raf=0,lastCode="",lastT=0;
 function load(k){try{return JSON.parse(localStorage.getItem(k)||"{}")}catch(e){return {}}}
 function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
 guests=load("wg");used=load("wu");
 function stats(){$("total").textContent=Object.keys(guests).length;$("in").textContent=Object.keys(used).length}
 function show(cls,title,sub){var r=$("result");r.className="panel "+cls;r.innerHTML="";var b=document.createElement("b");b.textContent=title;r.appendChild(b);if(sub){var s=document.createElement("span");s.textContent=sub;r.appendChild(s)}}
 function beep(ok){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=ok?880:220;o.connect(c.destination);o.start();setTimeout(function(){o.stop()},ok?120:350)}catch(e){}}
 function check(code){
  code=(code||"").trim().toUpperCase();if(!code)return;
  if(!guests[code]){show("bad","كود غير معروف",code);beep(false);return}
  if(used[code]){show("warn","الكود ده اتستخدم قبل كده",guests[code]+" — دخل الساعة "+used[code]);beep(false);return}
  used[code]=new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
  save("wu",used);stats();show("ok","مسموح بالدخول",guests[code]);beep(true);
 }
 $("load").onclick=function(){
  var g={};
  $("list").value.split("\n").forEach(function(l){
   var m=l.trim().match(/^(\S+)\s+(.+)$/);if(m)g[m[1].toUpperCase()]=m[2].trim();
  });
  guests=g;save("wg",g);stats();
  show("",Object.keys(g).length+" مدعو محفوظين","جاهز للمسح");
 };
 $("check").onclick=function(){check($("manual").value);$("manual").value=""};
 $("manual").onkeydown=function(e){if(e.key==="Enter")$("check").click()};
 $("reset").onclick=function(){if(confirm("تصفير كل حالات الدخول؟")){used={};save("wu",used);stats();show("","تم التصفير")}};
 var cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
 function tick(){
  var v=$("v");
  if(v.readyState===v.HAVE_ENOUGH_DATA){
   cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
   var d=cx.getImageData(0,0,cv.width,cv.height),q=jsQR(d.data,d.width,d.height);
   if(q&&q.data){var now=Date.now();if(q.data!==lastCode||now-lastT>3000){lastCode=q.data;lastT=now;check(q.data)}}
  }
  raf=requestAnimationFrame(tick);
 }
 $("start").onclick=function(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){show("bad","الكاميرا مش متاحة هنا","افتح الرابط في متصفح مباشرة أو اكتب الكود يدوي");return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(s){
   stream=s;var v=$("v");v.srcObject=s;v.play();$("cam").style.display="block";tick();
  }).catch(function(){show("bad","مفيش صلاحية للكاميرا","استخدم زرار تصوير الكود، أو افتح الرابط في متصفح الموبايل مباشرة وسمح بالكاميرا")});
 };
 $("stop").onclick=function(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(function(t){t.stop()});stream=null;$("cam").style.display="none"};
 $("snap").onclick=function(){$("file").click()};
 $("file").onchange=function(){
  var f=this.files&&this.files[0];if(!f)return;
  var img=new Image(),u=URL.createObjectURL(f);
  img.onload=function(){
   var s=Math.min(1,1200/Math.max(img.width,img.height));
   cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
   cx.drawImage(img,0,0,cv.width,cv.height);
   var d=cx.getImageData(0,0,cv.width,cv.height),q=jsQR(d.data,d.width,d.height,{inversionAttempts:"attemptBoth"});
   URL.revokeObjectURL(u);
   if(q&&q.data)check(q.data);else show("bad","مش قادر أقرأ الكود","قرّب الكاميرا وصوّر تاني");
  };
  img.src=u;this.value="";
 };
 var keys=Object.keys(guests);
 $("list").value=keys.map(function(k){return k+"\t"+guests[k]}).join("\n");
 stats();
})();
</script>
</body>
</html>
